{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join AuthCore by filling in the details below.</p>
        </div>

        <form id="registration-form" action="{{ url_for('register') }}" method="POST" class="auth-form" novalidate>
            <!-- CSRF Protection Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Name Field -->
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        class="form-control" 
                        placeholder="e.g. Jane Doe" 
                        value="{{ name or '' }}"
                        autocomplete="name"
                        maxlength="50"
                        required
                    >
                </div>
                <div class="error-feedback" id="name-error" aria-live="polite"></div>
            </div>

            <!-- Mail ID Field -->
            <div class="form-group">
                <label for="email" class="form-label">Mail ID</label>
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="e.g. jane.doe@example.com" 
                        value="{{ email or '' }}"
                        autocomplete="email"
                        maxlength="120"
                        required
                    >
                </div>
                <div class="error-feedback" id="email-error" aria-live="polite"></div>
            </div>

            <!-- Date of Birth Field -->
            <div class="form-group">
                <label for="dob" class="form-label">Date of Birth</label>
                <div class="input-wrapper">
                    <input 
                        type="date" 
                        id="dob" 
                        name="dob" 
                        class="form-control" 
                        value="{{ dob or '' }}"
                        required
                    >
                </div>
                <div class="error-feedback" id="dob-error" aria-live="polite"></div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="At least 8 characters" 
                        autocomplete="new-password"
                        maxlength="128"
                        required
                    >
                    <button 
                        type="button" 
                        class="password-toggle-btn" 
                        data-target="password" 
                        aria-label="Toggle password visibility"
                        title="Show/Hide Password"
                    >
                        <span class="toggle-icon">👁️</span>
                    </button>
                </div>
                <div class="error-feedback" id="password-error" aria-live="polite"></div>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-control" 
                        placeholder="Re-enter your password" 
                        autocomplete="new-password"
                        maxlength="128"
                        required
                    >
                    <button 
                        type="button" 
                        class="password-toggle-btn" 
                        data-target="confirm_password" 
                        aria-label="Toggle confirm password visibility"
                        title="Show/Hide Password"
                    >
                        <span class="toggle-icon">👁️</span>
                    </button>
                </div>
                <div class="error-feedback" id="confirm_password-error" aria-live="polite"></div>
            </div>

            <!-- Submit Button -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                    <span>Create Account</span>
                    <span>&rarr;</span>
                </button>
            </div>
        </form>

        <div class="auth-footer">
            <p class="auth-footer-text">Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Log In</a></p>
        </div>
    </div>
</div>
{% endblock %}
