{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Enter your credentials to access your account.</p>
        </div>

        <form id="login-form" action="{{ url_for('login') }}" method="POST" class="auth-form" novalidate>
            <!-- CSRF Protection Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Mail ID Field -->
            <div class="form-group">
                <label for="email" class="form-label">Mail ID</label>
                <div class="input-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="e.g. jane.doe@example.com" 
                        value="{{ email or '' }}"
                        autocomplete="email"
                        maxlength="120"
                        required
                    >
                </div>
                <div class="error-feedback" id="email-error" aria-live="polite"></div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Enter your password" 
                        autocomplete="current-password"
                        maxlength="128"
                        required
                    >
                    <button 
                        type="button" 
                        class="password-toggle-btn" 
                        data-target="password" 
                        aria-label="Toggle password visibility"
                        title="Show/Hide Password"
                    >
                        <span class="toggle-icon">👁️</span>
                    </button>
                </div>
                <div class="error-feedback" id="password-error" aria-live="polite"></div>
            </div>

            <!-- Submit Button -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
                    <span>Sign In</span>
                    <span>&rarr;</span>
                </button>
            </div>
        </form>

        <div class="auth-footer">
            <p class="auth-footer-text">Don't have an account yet? <a href="{{ url_for('register') }}" class="auth-link">Create one now</a></p>
        </div>
    </div>
</div>
{% endblock %}
